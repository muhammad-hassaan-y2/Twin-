[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oversight-twin"
version = "0.1.0"
description = "swarm-oversight's principal-wide monitor at tabletop-twin's PayPal/rail settlement seam"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oversight_twin*"]

# Importing oversight_twin puts both baselines on sys.path (see its __init__), so
# the integration tests need no PostgreSQL, no fastapi, and no installation of the
# two sibling projects. "." makes the oversight_twin package itself importable.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]