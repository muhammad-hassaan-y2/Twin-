# The demo stack: the service plus a throwaway PostgreSQL for the merchant book.
#
#   export OVERSIGHT_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
#   docker compose up --build          # -> http://127.0.0.1:8000/
#
# The token has no default. Without it compose refuses to start rather than serving an
# unauthenticated book. To use Neon instead of the local database, set
# OVERSIGHT_DATABASE_URL to the pooled DSN from the Neon console; the local `db` service
# is then simply unused.
name: oversight-twin

services:
  api:
    build:
      context: ..
      dockerfile: integration/Dockerfile
    image: oversight-twin:local
    environment:
      OVERSIGHT_API_TOKEN: ${OVERSIGHT_API_TOKEN:?set OVERSIGHT_API_TOKEN to a bearer token}
      OVERSIGHT_PAYEE: ${OVERSIGHT_PAYEE:-Ashgrove Audit LLP}
      OVERSIGHT_RAIL: ${OVERSIGHT_RAIL:-simulated}
      OVERSIGHT_PER_AGENT_LIMIT_CENTS: ${OVERSIGHT_PER_AGENT_LIMIT_CENTS:-50000}
      OVERSIGHT_PER_PAYEE_LIMIT_CENTS: ${OVERSIGHT_PER_PAYEE_LIMIT_CENTS:-60000}
      OVERSIGHT_MAX_INVOICE_CENTS: ${OVERSIGHT_MAX_INVOICE_CENTS:-250000}
      OVERSIGHT_DATABASE_URL: ${OVERSIGHT_DATABASE_URL:-postgresql://oversight:oversight@db:5432/oversight}
      OVERSIGHT_DB_SCHEMA: ${OVERSIGHT_DB_SCHEMA:-oversight}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Local stand-in for the Neon branch. The schema is created by the service on the first
  # billing call, under a transaction-scoped advisory lock, so both hosts run the same code.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oversight
      POSTGRES_USER: oversight
      POSTGRES_PASSWORD: oversight
    volumes:
      - book:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oversight -d oversight"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  book:
